<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Bloom</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">Study Bloom</div>

        <div class="nav-links">
            <a href="index.html" class="active">Dashboard</a>
            <a href="planner.html">Planner</a>
            <a href="focus.html">Focus</a>
            <a href="progress.html">Progress</a>
            <a href="parent.html">Parent</a>
        </div>
    </nav>
    <!-- Dashboard Content -->
    <section class="dashboard">
        <div class="container">
            <h1>Hello, Student</h1>
            <p class="subtitle">Ready to bloom today?</p>

            <div class="cards">
                <div class="card">
                    <h3>Today's Goal</h3>
                    <p class="big-number">2 hrs</p>
                    <p>2 of 4 sessions done</p>
                </div>

                <div class="card">
                    <h3>Current Streak</h3>
                    <p class="big-number">5 days</p>
                    <p>Keep going!</p>
                </div>

                <div class="card">
                    <h3>Energy</h3>
                    <p class="big-number">Good</p>
                    <p>Last check-in</p>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
